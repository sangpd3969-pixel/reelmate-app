<!-- Inline Interaction Logic (Micro-Interactions for Studio Feel) -->
<script>
    // Tab switching between Photo & Video
    const tabPhoto = document.getElementById('tab-photo');
    const tabVideo = document.getElementById('tab-video');

    tabPhoto.addEventListener('click', () => {
      tabPhoto.className = "px-4 py-1 rounded-full font-label-md text-label-md text-on-surface bg-gradient-to-r from-primary-container to-secondary-container font-bold shadow-md tracking-wider transition-all duration-200";
      tabVideo.className = "px-4 py-1 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface font-medium tracking-wider transition-all duration-200";
    });

    tabVideo.addEventListener('click', () => {
      tabVideo.className = "px-4 py-1 rounded-full font-label-md text-label-md text-on-surface bg-gradient-to-r from-primary-container to-secondary-container font-bold shadow-md tracking-wider transition-all duration-200";
      tabPhoto.className = "px-4 py-1 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface font-medium tracking-wider transition-all duration-200";
    });

    // Flash toggle micro-state
    const flashToggle = document.getElementById('flash-toggle');
    let flashOn = true;
    flashToggle.addEventListener('click', () => {
      flashOn = !flashOn;
      const icon = flashToggle.querySelector('.material-symbols-outlined');
      if (flashOn) {
        icon.textContent = 'flash_on';
        flashToggle.classList.add('text-primary');
        flashToggle.classList.remove('text-on-surface-variant');
      } else {
        icon.textContent = 'flash_off';
        flashToggle.classList.remove('text-primary');
        flashToggle.classList.add('text-on-surface-variant');
      }
    });

    // Camera Flip Animation
    const flipBtn = document.getElementById('flip-camera');
    const feed = document.getElementById('live-camera-feed');
    let flipped = false;
    flipBtn.addEventListener('click', () => {
      flipped = !flipped;
      feed.style.transform = flipped ? 'scaleX(-1) scale(1.05)' : 'scaleX(1) scale(1.05)';
      flipBtn.style.transform = 'rotate(180deg)';
      setTimeout(() => { flipBtn.style.transform = 'none'; }, 200);
    });

    // Shutter Trigger Haptic visual feedback
    const shutter = document.getElementById('shutter-btn');
    shutter.addEventListener('click', () => {
      feed.classList.add('brightness-200');
      setTimeout(() => {
        feed.classList.remove('brightness-200');
      }, 90);
    });
  </script>
<script>window.SCREEN="capture"</script><script src="../reel.js" defer></script><script src="../nav.js" defer></script>
