<body class="bg-background text-on-surface antialiased select-none min-h-screen flex flex-col justify-between overflow-x-hidden font-body-md text-body-md pb-2">
<!-- TOP APP BAR (Sub-page: focused editing context, custom back control) -->
<header class="sticky top-0 z-40 w-full bg-surface/90 backdrop-blur-xl px-4 py-2.5 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-2.5">

<div class="flex flex-col">
<div class="flex items-center gap-1.5">
<h1 class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight truncate max-w-[170px] sm:max-w-xs">

<span class="material-symbols-outlined text-outline text-[16px]">edit</span>
</div>
<div class="flex items-center gap-1.5 mt-0.5">
<span class="inline-flex items-center px-1.5 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm">

</div>

</button>
<button aria-label="초안 저장" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors active:scale-95 duration-150">

</button>
</div>
</header>
<!-- MAIN EDITING CANVAS -->
<main class="flex-1 flex flex-col items-center justify-start px-3 py-1.5 w-full max-w-md mx-auto relative gap-3">

<span class="material-symbols-outlined text-[20px] material-symbols-fill">pause</span>
</button>
<button aria-label="10초 앞으로" class="text-on-surface-variant hover:text-white transition-colors">

<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
<span class="font-label-md text-label-md font-medium">순서</span>

<span class="material-symbols-outlined text-[20px]">music_note</span>
<span class="font-label-md text-label-md font-medium">음악</span>

<span class="material-symbols-outlined text-[20px]">auto_fix_high</span>
<span class="font-label-md text-label-md font-medium">스타일</span>
</button>
</nav>
<!-- CONTEXTUAL SUB-EDITOR DRAWER: '자막' (Subtitle & Typography Tweaks) -->
<section class="w-full bg-surface-container-low rounded-2xl p-3 border border-outline-variant/30 flex flex-col gap-2.5 shadow-lg">
<div class="flex items-center justify-between">
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-label-md text-label-md font-bold text-on-surface">자막 스타일 &amp; 텍스트 수정</span>
</div>
<button class="font-label-sm text-label-sm text-secondary hover:underline flex items-center gap-0.5">
<span class="material-symbols-outlined text-[13px]">auto_awesome</span> AI 맞춤 추천

<button aria-label="적용하기" class="absolute right-1.5 w-7 h-7 rounded-lg bg-gradient-to-r from-primary-container to-secondary flex items-center justify-center text-white shadow-sm active:scale-90 transition-transform">

<span class="material-symbols-outlined text-[13px] material-symbols-fill">palette</span>

<button class="px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm font-medium hover:text-on-surface shrink-0">

<button class="px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm font-medium hover:text-on-surface shrink-0">

<button class="px-2.5 py-1 rounded-full bg-surface-container border border-outline-variant/30 text-on-surface-variant font-label-sm text-label-sm font-medium hover:text-on-surface shrink-0">

<button class="flex-[1.6] py-3 px-4 rounded-full bg-gradient-to-r from-primary-container via-primary-container to-secondary text-white font-label-lg text-label-lg font-bold flex items-center justify-center gap-1.5 glow-primary transition-all active:scale-97 duration-150 hover:brightness-105">
